    <main>
      <section class="contact-intro">
        <h1>Contact Me</h1>
      </section>

      <section class="contact">
        <!-- Contact form -->
        <form id="feedback-form" novalidate class="contact-form">
          <!-- Full Name -->
          <div class="form-group">
            <label for="full-name">Full Name</label>
            <input
              type="text"
              id="full-name"
              name="full-name"
              placeholder="Please enter your full name"
              minlength="2"
              required
              aria-describedby="full-name-error"
            />
            <span id="full-name-error" class="error-message"></span>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="name@example.com"
              required
              aria-describedby="email-error"
            />
            <span id="email-error" class="error-message"></span>
          </div>

          <!-- Topic of Interest -->
          <div class="form-group">
            <label for="topic">Topic of Interest</label>
            <select
              id="topic"
              name="topic"
              required
              aria-describedby="topic-error"
            >
              <option value="">Please select a topic</option>
              <option value="web-development">Web Development</option>
              <option value="backend-development">Backend Development</option>
              <option value="ai">Artificial Intelligence</option>
            </select>
            <span class="error-message" id="topic-error"></span>
          </div>

          <!-- Comments -->
          <div class="form-group">
            <label for="comments">Comments</label>
            <textarea
              id="comments"
              name="comments"
              rows="6"
              placeholder="Write your comments here"
              minlength="15"
              required
              aria-describedby="comments-counter comments-error"
            ></textarea>
            <span id="comments-counter" class="char-counter"
              >0/15 characters required</span
            >
            <span id="comments-error" class="error-message"></span>
          </div>

          <!-- Website -->
          <div class="form-group">
            <label for="website">Website (optional)</label>
            <input
              type="url"
              id="website"
              name="website"
              placeholder="https://example.com"
              aria-describedby="website-error"
            />
            <span class="error-message" id="website-error"></span>
          </div>

          <!-- Send button -->
          <div class="form-actions">
            <button type="submit" class="btn">Send</button>
            <button type="button" class="btn" id="clear-button">Clear</button>
          </div>

          <!-- Form status message -->
          <div id="form-status" role="status" aria-live="polite">
          </div>

        </form>

      </section>

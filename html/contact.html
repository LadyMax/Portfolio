  <main>
    <section class="contact-intro">
      <h1>Contact Me</h1>
    </section>

    <section class="contact">

      <!-- Contact form -->
      <form class="contact-form">

        <div class="name-fields">

          <div class="form-group">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="first-name" placeholder="Please enter your first name" required>
          </div>

          <div class="form-group">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="last-name" placeholder="Please enter your last name" required>
          </div>

        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="Please enter a subject" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" placeholder="Write your message here" required></textarea>
        </div>

        <button type="submit" class="btn">Send</button>

      </form>

    </section>

  </main>
